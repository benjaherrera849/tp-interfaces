<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio</title>

  <!-- Fuentes de Google (en enlaces separados para que si una falla, la otra siga funcionando) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@700&display=swap">

  <!-- Estilos: primero las variables, después la base y los componentes -->
  <link rel="stylesheet" href="css/variables.css">
   <link rel="stylesheet" href="css/juegos.css">
  <link rel="stylesheet" href="css/base.css">
   <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/botones.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="pantalla-carga">
<img src="assets/logo-cubo.png" alt="Logo" class="logo-carga">
<div class="barra-carga">
    <div class="barra-carga__progreso" id="progreso-carga"></div>
</div>
<p><span id="numero-carga">0</span>%</p>

</div>

<div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>
        
<main class="contenido-principal">
    
    <section class="hero-section" id="inicio">
        <div class="hero-wrapper">
            <button class="hero-btn hero-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            
            <div id="hero-contenedor" class="hero-contenedor">
                <!-- se inyecta a traves de api.js-->
            </div>

            <button class="hero-btn hero-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>
    
    <!-- Categoría: Acción -->
    <section class="categoria-seccion" id="accion">
        <h2 class="categoria-titulo">Acción</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            
            <div class="carrusel-contenedor" id="carrusel-accion">
                <!-- Acá inyecta el JS -->
            </div>
            
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

    <!-- Categoría: Aventura -->
    <section class="categoria-seccion" id="aventura">
        <h2 class="categoria-titulo">Aventura</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-aventura"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

    <!-- Categoría: Deportes -->
    <section class="categoria-seccion" id="deportes">
        <h2 class="categoria-titulo">Deportes</h2>
         <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-deportes"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
         </div>
    </section>
    <section class="categoria-seccion" id="tendencia">
        <h2 class="categoria-titulo">Tendencias Top</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-tendencia"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

    <section class="categoria-seccion" id="recientes">
        <h2 class="categoria-titulo">Agregados Recientemente</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-recientes"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>
    
    <section class="categoria-seccion" id="estrategia">
        <h2 class="categoria-titulo">Estrategia</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-estrategia"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

    <section class="categoria-seccion" id="disparos">
        <h2 class="categoria-titulo">Disparos</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-disparos"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

    <section class="categoria-seccion" id="simulacion">
        <h2 class="categoria-titulo">Simulación</h2>
        <div class="carrusel-wrapper">
            <button class="carrusel-btn carrusel-btn--prev"><i class="ph-fill ph-caret-circle-left"></i></button>
            <div class="carrusel-contenedor" id="carrusel-simulacion"></div>
            <button class="carrusel-btn carrusel-btn--next"><i class="ph-fill ph-caret-circle-right"></i></button>
        </div>
    </section>

</main>
    </div>

<script src="js/carga.js"></script>
<script src="js/header.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
</body>
</html>
