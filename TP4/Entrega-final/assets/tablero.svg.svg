<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <!-- Franjas de césped de 100px (alineadas con las 7 columnas) -->
  <rect x="0" y="0" width="100" height="700" fill="#2e7d32" />
  <rect x="100" y="0" width="100" height="700" fill="#256628" />
  <rect x="200" y="0" width="100" height="700" fill="#2e7d32" />
  <rect x="300" y="0" width="100" height="700" fill="#256628" />
  <rect x="400" y="0" width="100" height="700" fill="#2e7d32" />
  <rect x="500" y="0" width="100" height="700" fill="#256628" />
  <rect x="600" y="0" width="100" height="700" fill="#2e7d32" />

  <!-- Líneas de cal de la cancha -->
  <g stroke="rgba(255,255,255,0.85)" stroke-width="4" fill="none">
    <!-- Borde exterior -->
    <rect x="20" y="20" width="660" height="660" />
    <!-- Línea y círculo central (centro en 350, 350 = casilla 3,3) -->
    <line x1="20" y1="350" x2="680" y2="350" />
    <circle cx="350" cy="350" r="75" />
    <!-- Área grande y chica superior -->
    <rect x="175" y="20" width="350" height="130" />
    <rect x="250" y="20" width="200" height="55" />
    <path d="M 285 150 A 70 70 0 0 0 415 150" />
    <!-- Área grande y chica inferior -->
    <rect x="175" y="550" width="350" height="130" />
    <rect x="250" y="625" width="200" height="55" />
    <path d="M 285 550 A 70 70 0 0 1 415 550" />
  </g>

  <!-- 4 esquinas fuera de juego (2x2 casillas = 200x200px) oscurecidas -->
  <g fill="rgba(10, 18, 28, 0.72)">
    <rect x="0" y="0" width="200" height="200" />
    <rect x="500" y="0" width="200" height="200" />
    <rect x="0" y="500" width="200" height="200" />
    <rect x="500" y="500" width="200" height="200" />
  </g>

  <!-- Borde luminoso de la cruz jugable -->
  <path d="M 200 0 H 500 V 200 H 700 V 500 H 500 V 700 H 200 V 500 H 0 V 200 H 200 Z" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" />
</svg>